name: Build Still iOS Simulator App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: XcodeGen installieren
      run: brew install xcodegen

    - name: Alte Caches und Projekte bereinigen
      run: |
        rm -rf Still.xcodeproj
        rm -rf build/

    - name: Xcode-Projekt generieren
      run: xcodegen generate

    - name: iOS Simulator Build erstellen
      run: |
        xcodebuild build \
          -project Still.xcodeproj \
          -scheme Still \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Simulator .app hochladen
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Still-iOS-Simulator-App
        path: build/DerivedData/Build/Products/Release-iphonesimulator/Still.app